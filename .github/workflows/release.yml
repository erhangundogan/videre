name: Release

# Separate from ci.yml on purpose: a tag push must not be blocked by, or
# entangled with, the test matrix. CI gates `main`; this gates the artifacts.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # required to upload release assets

jobs:
  # taiki-e/upload-rust-binary-action uploads *to an existing release*; pushing
  # a tag does not create one. Without this the builds all succeed and every
  # upload fails with "release not found", which is what happened on the first
  # attempt. Created as a draft so a failing smoke job can stop it going public.
  create-release:
    name: create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create or reuse the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists, reusing it"
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" \
              --notes "Artifacts are uploaded by CI. Published once the smoke job passes."
          fi

  build:
    needs: create-release
    name: build ${{ matrix.target }}
    strategy:
      # One target failing must not cancel the others: knowing three of four
      # built is more useful than knowing the run stopped.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # Intel macOS is CROSS-COMPILED from the arm64 runner, not built on
          # a macos-13 runner. GitHub is retiring that image, and asking for
          # the label does not fail: the job simply queues for a runner that
          # never arrives. Measured 2026-08-10, it sat for 10 hours without
          # executing a single step while the other three targets finished in
          # 5-10 minutes. A build that hangs forever is worse than one that
          # fails, so do not reintroduce a macos-13 runner here.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    # Belt and braces: no build should take anywhere near this. The default is
    # 6 hours, which is how a queued job burned a night.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Add the target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      # NOTE: aarch64-unknown-linux-gnu needs `-C target-feature=+fp16`, which
      # `.cargo/config.toml` sets for that target. Builds run from the repo
      # root and inherit it. Without it the build dies with 11x
      # `error: instruction requires: fullfp16` from gemm-f16 (a transitive
      # candle-core dependency). Do not "simplify" that config file away.
      #
      # NOTE: never replace this with `cargo check` on ARM64 Linux. `check`
      # passes even when `build` fails, because it skips codegen.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: videre
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

      # Proof the artifact is self-contained. macOS was measured before this
      # workflow existed (system frameworks only, zero rpath, ONNX Runtime
      # statically linked). Linux was assumed, so print it and read it: a
      # versioned libonnxruntime.so, or any path inside the runner's
      # workspace, means the archive is not portable and the distribution
      # story changes.
      - name: Report dynamic dependencies
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/videre"
          [ -f "$bin" ] || bin="target/release/videre"
          echo "== $bin =="
          ls -lh "$bin"
          if command -v otool >/dev/null; then otool -L "$bin"; else ldd "$bin" || true; fi

  smoke:
    name: smoke ${{ matrix.target }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-compiled Intel artifact runs here under Rosetta, which is
          # a weaker check than a real Intel runner but still proves the
          # archive extracts and the binary is not obviously broken.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # Fixtures live in the repo (they are `exclude`d from the crate package,
      # not from git), so checkout gives the smoke test real JPEG/MOV/MP4 to
      # work on without downloading anything.
      - uses: actions/checkout@v5

      - name: Download the built artifact
        shell: bash
        run: |
          set -eux
          gh release download "$GITHUB_REF_NAME" \
            --pattern "videre-$GITHUB_REF_NAME-${{ matrix.target }}.tar.gz" \
            --output videre.tar.gz
          tar xzf videre.tar.gz
          chmod +x videre
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The point of this job: a binary that only runs where it was built is a
      # failure mode this project has hit three times in other forms. Exercise
      # the real thing on a runner that never compiled it.
      #
      # No model downloads, so it stays fast. VIDERE_HOME is pinned to a temp
      # directory so the smoke test cannot touch the runner's real home, the
      # same discipline the test suite uses.
      #
      # Asserts the exit code and a non-zero file count, not an exact count:
      # Linux skips HEIC and video frames, so counts legitimately differ by
      # platform.
      - name: Run it
        shell: bash
        run: |
          set -eux
          export VIDERE_HOME="$(mktemp -d)"
          ./videre --version
          ./videre scan crates/videre/tests/fixtures --db "$VIDERE_HOME/t.db" --silent
          ./videre stats --db "$VIDERE_HOME/t.db"
          n=$(./videre stats --db "$VIDERE_HOME/t.db" --json | grep -oE '"total_files":[0-9]+' | grep -oE '[0-9]+')
          echo "scanned $n file(s)"
          test "$n" -gt 0

  # The gate. Only a release whose artifacts have been downloaded onto a clean
  # runner and actually executed becomes visible. If smoke fails, the draft
  # stays a draft: the tag exists, the binaries exist, but nobody is offered a
  # download that was never run.
  publish:
    name: publish the release
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Undraft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
