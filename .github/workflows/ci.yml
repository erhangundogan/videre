name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: formatting feedback is
# only useful for the current tip.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job sets timeout-minutes. The default is six hours, and a hung job
# fails nothing, so it would hold a runner and the PR's checks that long. Each
# limit is several times the longest successful run measured over the last
# 110 runs (rustfmt 1m, clippy 3m, build-arm64 2m, Linux tests 7m, macOS
# tests 15m including its retry), leaving room for a cold cache.
jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing later in the job pushes or fetches with this token.
          persist-credentials: false

      # No cargo build, no dependency resolution: rustfmt parses the source
      # directly. That is what keeps this job under a minute despite the
      # workspace pulling in candle and ONNX Runtime, and why it needs no
      # dependency cache.
      #
      # The version comes from rust-toolchain.toml, which is the only place it
      # is written. Before it existed this job used the runner's preinstalled
      # Rust while the development machine used a Homebrew one, so "it passes
      # locally" and "it passes in CI" were different claims.
      #
      # Installed explicitly rather than relied on: `make fmt-check` shells out
      # to `rustup run`, which does not install a missing toolchain on every
      # rustup version. The bare `cargo` in the test job below does auto-install
      # from the file, but being explicit costs one line and removes the
      # dependency on which behaviour this runner has.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install --profile minimal --component rustfmt \
            "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"

      - name: Check formatting
        run: make fmt-check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing later in the job pushes or fetches with this token.
          persist-credentials: false

      # Unlike rustfmt, clippy type-checks the whole workspace, so it needs the
      # dependencies compiled (candle, ONNX Runtime) and therefore this cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The version comes from rust-toolchain.toml, the one place it is written.
      # Installed explicitly (with the clippy component) rather than relied on,
      # for the same reason the fmt job installs rustfmt explicitly.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install --profile minimal --component clippy \
            "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"

      # -D warnings makes any lint fail the build, so the count cannot drift
      # upward again: every lint is either fixed or given a justified #[allow]
      # with a reason in the source. This lints the Linux configuration; the
      # cfg(target_os = "macos") branches (HEIC and video via QuickLook) are
      # compiled out here and are linted by the dev machine's `make lint`.
      - name: Lint
        run: make lint-check

  test:
    name: test (${{ matrix.os }})
    strategy:
      # Do not let a macOS failure hide the Linux result, or vice versa.
      # Running both is the entire point of the matrix.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          # GitHub's macos-26 runner (image build 20260831) intermittently fails
          # SQLite and flock disk writes with SQLITE_IOERR_WRITE (778): a
          # transient I/O error from its virtual disk, not a code defect (green
          # locally, on Linux, and on the prior image). We cannot fix the runner,
          # so we defend in depth. `test_threads: 2` caps parallelism, which
          # removes the concurrency-driven failures (measured: full suite 6/30
          # failed at the default 3 threads, 0/30 at 2). `test_attempts: 2`
          # runs the step at most twice, so a residual single-write transient
          # (which throttling cannot prevent) is absorbed by one rerun rather
          # than red-failing a good commit; a real failure fails both attempts.
          # Linux sets neither, so it runs once at full speed. Revisit when a
          # later macOS
          # image is stable. `os` still names the job (and the branch-protection
          # check), so do not rename it.
          - os: macos-latest
            test_threads: "2"
            test_attempts: "2"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing later in the job pushes or fetches with this token.
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Model weights, persisted between runs. Keyed on the two files that
      # decide which weights are fetched, so changing the buffalo_l repo or
      # DEFAULT_MODEL_ID invalidates the cache rather than silently reusing
      # weights for a different model.
      #
      # The v2 salt exists to discard a poisoned artifact. Until 0.15.6 the
      # argument-robustness tests ran `videre embed`, which downloaded SigLIP on
      # the Linux runner even though the warm-up step deliberately fetches it on
      # macOS only. This cache then kept those weights, and
      # cpu_batch_matches_single_image_baseline - which skips when weights are
      # absent, and had done so since it was written - started running: the
      # Ubuntu job went from ~3 minutes to nearly 40. The download is fixed, but
      # the key hashes two files that did not change, so the bad artifact would
      # be restored forever without this. Bump the salt again if weights ever
      # get in that should not be there.
      - id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-v2-${{ runner.os }}-${{ hashFiles('crates/videre-ml/src/face_models.rs', 'crates/videre-core/src/embeddings.rs') }}

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install --profile minimal --component clippy \
            "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"

      - name: Build
        run: cargo build --workspace --tests

      # Downloading happens here, in an explicit step, and never inside a test.
      # That is what keeps "tests never download" literally true and puts the
      # cost on its own visible line in the log.
      #
      # Needs a database with a real image in it: `videre faces` returns before
      # loading any model when there is nothing to process, so warming up
      # against an empty database would download nothing and leave the tests
      # skipping.
      #
      # ~200 MB on Linux, ~1.6 GB on macOS (which also runs the SigLIP-backed
      # embed tests). Once per cache key.
      - name: Populate the model cache
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          set -eux
          bin="$PWD/target/debug/videre"
          mkdir -p /tmp/warm
          cp crates/videre/tests/fixtures/sample_with_exif.jpg /tmp/warm/
          "$bin" --library /tmp/warm scan --silent
          "$bin" --library /tmp/warm faces --silent
          if [ "$RUNNER_OS" = "macOS" ]; then
            "$bin" --library /tmp/warm embed --silent
          fi

      # VIDERE_TEST_REQUIRE_MODELS turns a cold-cache skip into a failure. A
      # skip here would mean the cache silently stopped working and the
      # model-backed tests quietly stopped running.
      # --no-fail-fast for the same reason the matrix sets fail-fast: false.
      # Without it cargo stops at the first failing test binary, so one failure
      # hides every later one: a Linux-only failure in videre-core's lib tests
      # meant the videre integration tests never ran on Linux at all, and their
      # result was unknown rather than green.
      - name: Test
        env:
          VIDERE_TEST_REQUIRE_MODELS: 1
          # Both are set only for macOS (see the matrix comment); on Linux they
          # are empty, so it runs once at full parallelism.
          TEST_THREADS: ${{ matrix.test_threads }}
          TEST_ATTEMPTS: ${{ matrix.test_attempts }}
        # A retry here tolerates the macOS runner's transient disk-write faults
        # without hiding real failures: a genuine bug fails every attempt, while
        # a one-off SQLITE_IOERR_WRITE passes on a rerun. The retry is loud, so a
        # flake is always visible in the log rather than silently swallowed.
        run: |
          set -u
          args=(--workspace --no-fail-fast)
          if [ -n "${TEST_THREADS:-}" ]; then
            args+=(-- --test-threads="$TEST_THREADS")
          fi
          attempts="${TEST_ATTEMPTS:-1}"
          n=1
          while true; do
            echo "::group::cargo test (attempt $n/$attempts)"
            if cargo test "${args[@]}"; then
              echo "::endgroup::"
              [ "$n" -gt 1 ] && echo "::warning::tests passed on attempt $n after $((n-1)) transient failure(s)"
              break
            fi
            echo "::endgroup::"
            if [ "$n" -ge "$attempts" ]; then
              echo "::error::tests still failing after $attempts attempt(s); this is a real failure, not a flake"
              exit 1
            fi
            echo "::warning::attempt $n failed; retrying (GitHub macOS runner disk faults are expected here, real failures survive every attempt)"
            n=$((n + 1))
          done

      # Tests never download model weights, and this is what enforces it rather
      # than trusting it.
      #
      # Linux only, because it is the platform where the claim is checkable: the
      # warm-up step above fetches SigLIP on macOS deliberately, so its presence
      # there proves nothing. On Linux nothing should ever put it here, so if it
      # exists, a test pulled it.
      #
      # This is not hypothetical. A unit test in classify.rs downloaded 778MB of
      # SigLIP because its "already classified" fixture never actually inserted
      # the row. The weights landed in this cache, which woke
      # cpu_batch_matches_single_image_baseline - a test that skips when weights
      # are absent and had skipped since the day it was written - and the job
      # went from ~3 minutes to nearly 40. Nothing failed, so it read as a hang
      # for days. A build failure here would have said it in one line.
      #
      # Runs even when the tests fail, since a failing test can still have
      # downloaded on its way to failing.
      - name: Assert the tests downloaded no embedding weights
        if: always() && runner.os == 'Linux'
        run: |
          found=$(find ~/.cache/huggingface -maxdepth 3 -type d -name 'models--*siglip*' 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "::error::A test downloaded SigLIP weights. Tests never download."
            du -sh $found
            echo "Find it with: HF_HOME=\$(mktemp -d) cargo test -p videre --bins"
            echo "(--bins matters: the last one hid in the binary target, not tests/)"
            exit 1
          fi
          echo "no embedding weights present, as expected"

  # A probe of the aarch64 install path that deliberately does NOT use the
  # repo's own build configuration, because the two answer different questions.
  #
  # .cargo/config.toml gives in-repo aarch64 builds `-C target-feature=+fp16`
  # because gemm-f16 (pulled in by candle-core) emits FP16 instructions
  # outside the baseline target set; without the flag codegen dies with
  # "error: instruction requires: fullfp16". `cargo install videre` from
  # crates.io reads the installing user's cargo config instead of ours, so
  # it gets no such flag. Setting RUSTFLAGS makes cargo ignore rustflags
  # from every config file, so this build sees exactly what an installing
  # user sees. (An empty CARGO_TARGET_<triple>_RUSTFLAGS does NOT do that:
  # the config flags still apply. Measured, not assumed.)
  #
  # Expected state, measured 2026-09-15 (gemm-f16 0.19.0, pulp 0.22.3,
  # rustc 1.96.0): this build FAILS. That is the known, documented state and
  # keeps the job green. The job goes red on purpose the day the build
  # passes, because that is the actionable day: the fp16 workaround in
  # .cargo/config.toml and the README install note have become unnecessary
  # and should be removed.
  #
  # cargo check can never substitute for this: check emits no machine code,
  # so it passes even where every rustc backend call would fail.
  build-arm64:
    name: build (aarch64-linux, no fp16 override)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing later in the job pushes or fetches with this token.
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install --profile minimal \
            "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"

      # The build is expected to fail while the workaround is needed, so this
      # step swallows its own exit code and reports the result as an output:
      # a failed step would paint a permanent red X and an "exit code 101"
      # annotation on every run, which is the noise this job exists to avoid.
      - name: Build without the repo's fp16 override
        id: build
        env:
          RUSTFLAGS: "-C debuginfo=0"
        run: |
          set +e
          cargo build --workspace
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "build_result=success" >> "$GITHUB_OUTPUT"
          else
            echo "build_result=failure" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # Invert the probe into the job's verdict: failure is the expected,
      # documented state and stays green; success is the rare, actionable
      # day and turns the job red so the workaround cleanup cannot be missed.
      - name: Report the install-path state
        if: always()
        run: |
          if [ "${{ steps.build.outputs.build_result }}" = "success" ]; then
            echo "::error::aarch64 builds clean without +fp16 now. The workaround in .cargo/config.toml and the README install note are removable; drop them and close the aarch64 install ticket."
            exit 1
          fi
          echo "::notice::aarch64 install path still requires the fp16 RUSTFLAGS workaround (expected; documented in the README)."
