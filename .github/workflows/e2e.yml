name: Gallery E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromium:
    name: Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Enable Corepack and install Yarn dependencies
        run: |
          corepack enable
          yarn --cwd e2e install --immutable

      - name: Install Chromium
        run: yarn --cwd e2e exec playwright install --with-deps chromium

      - name: Build the debug binary
        run: make build-dev

      - name: Run the gallery browser suite
        run: yarn --cwd e2e test

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-artifacts
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
