<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>videre map</title>
<style>{{ chrome|safe }}</style>
<style>{{ gallery_css|safe }}</style>
<link rel="stylesheet" href="/vendor/{{ vendor_version }}/maplibre-gl.css">
<style>{{ css|safe }}</style>
</head>
<body>
{% include "nav.html" %}
<div class="lightbox" id="lb" onclick="closeLb()">
  <button type="button" class="lb-nav lb-prev" id="lb-prev" aria-label="Previous" onclick="event.stopPropagation();lbStep(-1)" hidden>&#8249;</button>
  <div class="lb-stage" onclick="event.stopPropagation()">
    <div class="lb-controls">
      <button type="button" class="lb-fs" id="lb-fs" aria-label="Fullscreen" title="Fullscreen" onclick="toggleLbFullscreen()" hidden>&#x26F6;</button>
      <button type="button" class="lb-close" id="lb-close" aria-label="Close" title="Close" onclick="closeLb()">&times;</button>
    </div>
    <img id="lb-img" src="" alt="">
    <video id="lb-vid" src="" controls autoplay style="display:none"></video>
    <div class="lb-meta" id="lbMeta"></div>
  </div>
  <button type="button" class="lb-nav lb-next" id="lb-next" aria-label="Next" onclick="event.stopPropagation();lbStep(1)" hidden>&#8250;</button>
</div>
<div class="header">
  <h1>videre</h1>
  <p class="subtitle">{{ db|safe }} &mdash; {{ generated_at }}</p>
  <div class="stats"><div class="stat"><span class="num">{{ total_files }}</span><span class="label">Files scanned</span></div></div>
</div>
<main class="map-page">
  <div id="map-selection-row" class="map-selection-row" hidden>
    <nav id="map-breadcrumb" aria-label="Map breadcrumb"></nav>
    <label for="map-radius">Radius</label>
    <input id="map-radius" type="number" min="1" step="1">
    <span>km</span>
  </div>
  <p id="map-selection-status" class="map-selection-status" role="status" hidden></p>
  <div id="map-plot-wrap">
    <canvas id="map-plot"></canvas>
    <div id="map-empty" class="muted" hidden>Run <code>videre locations</code> to plot your photos</div>
  </div>
  <div class="gallery-head">
    <h2>All files</h2>
    <label class="view-toggle">View <select class="view-mode-select" onchange="setViewMode(this.value)"><option value="list">List</option><option value="tile">Tile</option></select></label>
  </div>
  <div class="gallery" id="gallery"></div>
  <div class="more-wrap"><button id="gallery-more" onclick="showMoreGallery()"></button></div>
</main>
<script>{{ globals|safe }}</script>
<script>window.BASEMAP_STYLE={{ basemap_style|safe }};</script>
<script src="/vendor/{{ vendor_version }}/maplibre-gl.js"></script>
<script src="/vendor/{{ vendor_version }}/pmtiles.js"></script>
<script>{{ justified_js|safe }}</script>
<script>{{ gallery_js|safe }}</script>
<script>{{ js|safe }}</script>
</body>
</html>
