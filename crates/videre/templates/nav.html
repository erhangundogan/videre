{# The section strip, shared by `gallery.html` and `faces.html`.

   :warning: It carries its own `<style>` on purpose. The two pages that include
   it have separate stylesheets (`gallery.css`, `faces.css`), so styling it there
   would mean two copies of the same rules kept in step by hand. A component
   included in two documents keeps its markup and its rules together, in one
   file, and adding a section later touches only this one.

   `nav` is `Option<Section>`, the current section, and `None` on any page that has
   nowhere to navigate to: a static `--html` export has no server, and the
   labeling-only server has no `/date` or `/`. Every route linked here exists
   only under `videre gallery`, which routes all three together.

   :warning: The reserved route `/smart` is deliberately absent. It answers
   404 "Not built yet", and a link to that is worse than no link. Add it here
   when it renders.

   The gallery settings (`commands/gallery/settings.rs`) are emitted first and
   outside the nav condition, so every page that includes this file, a static
   export too, has them before its own scripts run. #}
{{ settings_script|safe }}<style>.settings-banner{padding:8px 16px;background:#7f1d1d;color:#fecaca;font:500 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
{% if let Some(current) = nav %}<style>
.secnav{display:flex;align-items:center;gap:2px;padding:10px 16px;background:#1a1a1f;border-bottom:1px solid #2a2a33;position:sticky;top:0;z-index:50}
/* The brand link is excluded from these rules so it never gets the section
   buttons' hover/active highlight. */
.secnav a:not(.secnav-brand){padding:6px 14px;border-radius:6px;color:#9a9aa8;text-decoration:none;font:500 14px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.secnav a:not(.secnav-brand):hover{background:#25252d;color:#d8d8e0}
.secnav a.on{background:#3b82f6;color:#fff}
/* The videre wordmark (the docs-site logo) links home from the far left. It is
   never highlighted: no background on hover, no active state. */
.secnav-brand{display:flex;align-items:center;padding:2px 8px 2px 0;margin-right:4px;text-decoration:none}
.secnav-logo{display:block;height:20px;width:auto;color:#f4f4f5}
/* The spacer pushes the search box and the "..." menu to the far right. It is
   its own element, not the search box's auto margin, because the search box is
   hidden on a library with no embeddings and the menu must stay right. */
.secnav-spacer{flex:1}
/* The search box always submits to `/`, where the Files page reads `?q=` and
   runs a semantic search; from any other section it just navigates there
   first. */
.secnav-search{display:flex}
/* 5px vertical padding (not 6px) so the input's 1px border does not make it
   taller than the borderless section links; the strip is then the same height
   whether the search box shows or is hidden. */
.secnav-search input{width:200px;max-width:42vw;padding:5px 12px;border:1px solid #2a2a33;border-radius:6px;background:#25252d;color:#d8d8e0;font:500 14px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.secnav-search input::placeholder{color:#71717a}
.secnav-search input:focus-visible{outline:2px solid #3b82f6;outline-offset:1px}
/* The "..." menu sits after the search box at the far right. Its item reuses
   the section-link rule above for padding, colour and hover. */
.secnav-menu{position:relative;margin-left:8px}
.secnav-more{padding:4px 10px;border:0;border-radius:6px;background:transparent;color:#9a9aa8;font:600 18px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer}
.secnav-more:hover,.secnav-more[aria-expanded=true]{background:#25252d;color:#d8d8e0}
.secnav-more:focus-visible{outline:2px solid #3b82f6;outline-offset:1px}
.secnav-menu-list{position:absolute;right:0;top:calc(100% + 6px);min-width:160px;padding:4px;background:#1f1f25;border:1px solid #2a2a33;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.secnav-menu-list[hidden]{display:none}
.secnav-menu-list a{display:flex;align-items:center;gap:8px}
</style>

<script>
// The nav's "..." menu: page-independent actions, Settings first. Closes on
// Escape (focus back to the button), an outside click, or choosing an item.
(function(){
  var btn=document.getElementById('secnav-more'),list=document.getElementById('secnav-menu-list');
  function set(open){
    list.hidden=!open;
    btn.setAttribute('aria-expanded',String(open));
    if(open){ var first=list.querySelector('[role=menuitem]'); if(first)first.focus(); }
  }
  btn.addEventListener('click',function(e){ e.stopPropagation(); set(list.hidden); });
  document.addEventListener('click',function(e){ if(!list.hidden&&!list.contains(e.target))set(false); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!list.hidden){ set(false); btn.focus(); } });
})();
</script>
