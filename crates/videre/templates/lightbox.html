<div class="lightbox" id="lb" onclick="closeLb()">
  <button type="button" class="lb-nav lb-prev" id="lb-prev" aria-label="Previous" onclick="event.stopPropagation();lbStep(-1)" hidden>&#8249;</button>
  <div class="lb-stage" onclick="event.stopPropagation()">
    <div class="lb-controls">
      <button type="button" class="lb-rotate" id="lb-rotate-ccw" aria-label="Rotate left" title="Rotate 90&#176; counter-clockwise" onclick="rotateLb('ccw')" hidden>&#x21ba;</button>
      <button type="button" class="lb-rotate" id="lb-rotate" aria-label="Rotate right" title="Rotate 90&#176; clockwise" onclick="rotateLb('cw')" hidden>&#x21bb;</button>
      <button type="button" class="lb-fs" id="lb-fs" aria-label="Fullscreen" title="Fullscreen" onclick="toggleLbFullscreen()" hidden>&#x26F6;</button>
      <button type="button" class="lb-close" id="lb-close" aria-label="Close" title="Close" onclick="closeLb()">&times;</button>
    </div>
    <img id="lb-img" src="" alt="">
    <video id="lb-vid" src="" controls autoplay style="display:none"></video>
    <p class="lb-unplayable" id="lb-unplayable" hidden>This browser cannot play this video's format. <a href="" download>Download the original</a> to play it in another app.</p>
    <div class="lb-meta" id="lbMeta"></div>
  </div>
  <button type="button" class="lb-nav lb-next" id="lb-next" aria-label="Next" onclick="event.stopPropagation();lbStep(1)" hidden>&#8250;</button>
</div>
