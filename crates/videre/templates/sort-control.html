{# The Sort control for a settings bar. `event_sort` picks the Events
   overview's fields, since that page orders events rather than files. Which
   settings key the choice is kept under is gallery.js's `SORT`. #}<label class="view-toggle">Sort <select class="sort-select" onchange="setSortField(this.value)">{% if event_sort %}<option value="date">Date</option><option value="files">Files</option><option value="length">Length</option><option value="name">Name</option>{% else %}<option value="date">Date</option><option value="name">Name</option><option value="size">Size</option><option value="rating">Rating</option><option value="liked">Liked</option><option value="type">Type</option>{% endif %}</select><button type="button" class="sort-dir-btn" aria-pressed="false" aria-label="Toggle sort direction" onclick="toggleSortDir()"><svg class="sort-tri" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2 L11 10 L1 10 Z"/></svg></button></label>
