<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Person</title>
  <style>{{ css|safe }}</style>
</head>
<body>
  {% include "nav.html" %}
  <main style="padding: 24px 32px">
    <div class="toolbar">
      <a id="backLink" href="{{ back_href }}">&larr; {{ back_label }}</a>
      <strong id="person-title">Person</strong>
      <span id="face-count" style="color:#555;font-size:13px"></span>
      <span id="status"></span>
      <span id="renameArea" style="display:none">
        <input type="text" id="renameInput" maxlength="60">
        <button class="primary" style="margin-left:8px" onclick="submitRename()">Save</button>
      </span>
      <button id="removeBtn" class="danger" style="display:none;margin-left:auto" onclick="removePerson()">Remove person</button>
    </div>

    <div id="faces-grid" class="grid"></div>

    <section id="learning-history" data-learning-history hidden>
      <h2>Learning history</h2>
      <p class="learning-history-note">What the gallery recorded from actions about
        this person. These teach future suggestions; they never relabel faces.</p>
      <div id="learning-history-rows"></div>
    </section>
  </main>

  <script>window.FACES_UI_ENABLED = {{ faces_ui_enabled }};</script>
  <script>let PEOPLE_ROOT="{{ back_href }}";</script>
  <script>{{ js|safe }}</script>
</body>
</html>
