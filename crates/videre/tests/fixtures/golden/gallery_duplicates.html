<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>videre</title>
<style>/* Page chrome shared by every videre page.
 *
 * :warning: This exists because `/people` did not look like the others. It is
 * rendered from `faces.html` with its own stylesheet, so it had a different
 * font, a white background, `padding: 16px` on the body that inset the sticky
 * nav, and no header block at all. Two stylesheets meant two answers to
 * questions that should have one.
 *
 * Page-specific rules stay in `gallery.css` and `faces.css`; anything that
 * decides what a videre page *is* belongs here.
 */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f4f5;color:#18181b;font-size:14px;line-height:1.5}
.header{background:#18181b;color:#fff;padding:24px 32px}
.header h1{font-size:20px;font-weight:700;margin-bottom:2px}
.subtitle{color:#71717a;font-size:12px;font-family:monospace;margin-bottom:20px}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stat{background:#27272a;border-radius:8px;padding:12px 20px;min-width:130px}
.num{font-size:22px;font-weight:700;display:block}
.label{font-size:11px;color:#a1a1aa;text-transform:uppercase;letter-spacing:.06em}
.stat.warn .num{color:#fbbf24}
.toolbar{padding:10px 32px;background:#fff;border-bottom:1px solid #e4e4e7;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 1px 3px rgba(0,0,0,.06)}
button{padding:5px 12px;border:1px solid #d4d4d8;background:#fff;border-radius:6px;cursor:pointer;font-size:12px;color:#3f3f46}
button:hover{background:#f4f4f5;border-color:#a1a1aa}
/* A view that legitimately has nothing to show still has to say so. */
.empty-state{max-width:640px;margin:64px auto;padding:32px;text-align:center;background:#fff;border:1px solid #e5e5ec;border-radius:12px}
.empty-state h2{margin:0 0 12px;font-size:20px;color:#1a1a1f}
.empty-state p{margin:0 0 10px;color:#55555f;line-height:1.5}
.empty-state .hint{font-size:14px;color:#8a8a96}
.empty-state code{background:#f4f4f8;padding:2px 6px;border-radius:4px;font-size:13px}
</style>
<style>
.sort-label{font-size:12px;color:#3f3f46;display:flex;align-items:center;gap:6px}
.sort-label select{padding:4px 8px;border:1px solid #d4d4d8;border-radius:6px;font-size:12px;background:#fff;color:#3f3f46;cursor:pointer}
.info{margin-left:auto;color:#a1a1aa;font-size:12px}
.groups{padding:16px 32px;display:flex;flex-direction:column;gap:10px}
.group{background:#fff;border-radius:10px;border:1px solid #e4e4e7;overflow:hidden}
.group-header{padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;user-select:none}
.group-header:hover{background:#fafafa}
.arrow{font-size:9px;color:#a1a1aa;transition:transform .15s;display:inline-block;width:10px;flex-shrink:0}
.group.open .arrow{transform:rotate(90deg)}
.hash{font-family:monospace;font-size:12px;background:#f4f4f5;padding:2px 8px;border-radius:4px;color:#52525b;flex-shrink:0}
.group-meta{font-size:13px;color:#71717a}
.waste{margin-left:auto;font-size:12px;font-weight:600;color:#dc2626;flex-shrink:0}
.group-body{display:none;border-top:1px solid #f4f4f5;overflow-x:auto}
.group.open .group-body{display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#fafafa;padding:7px 12px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#71717a;border-bottom:1px solid #e4e4e7;white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid #f4f4f5;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.keep td{background:#f0fdf4}
tr.remove:hover td{background:#fef2f2}
.badge span{padding:2px 7px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.keep-badge{background:#dcfce7;color:#166534}
.remove-badge{background:#fee2e2;color:#991b1b}
.filename{font-weight:500;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.path-cell{font-family:monospace;font-size:11px;max-width:380px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.path-text{color:#3f3f46}
.copy-btn{margin-left:4px;padding:1px 5px;font-size:11px;vertical-align:middle;opacity:.5;border-radius:4px}
.copy-btn:hover{opacity:1}
.dim{color:#a1a1aa;font-size:12px}
.gps a{color:#3b82f6;text-decoration:none;font-size:12px}
.gps a:hover{text-decoration:underline}
.no-dupes{padding:48px;text-align:center;color:#71717a}
td.preview{width:130px;text-align:center;vertical-align:middle;padding:6px 10px}
th.preview-th{width:130px}
.thumb{max-width:120px;max-height:120px;object-fit:contain;border-radius:6px;display:block;margin:0 auto;cursor:zoom-in;transition:transform .15s}
.thumb:hover{transform:scale(1.05)}
.no-prev{color:#a1a1aa;font-size:11px;display:block;text-align:center}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox.on{display:flex}
.lightbox img,.lightbox video{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.6)}
.lb-meta{position:absolute;bottom:0;left:0;right:0;background:rgba(24,24,27,.85);padding:10px 16px;display:none;gap:12px;align-items:flex-start;flex-wrap:wrap}
.lb-meta.on{display:flex}
.lb-face{text-align:center;font-size:11px;color:#fff}
.lb-face img{width:48px;height:48px;border-radius:50%;object-fit:cover;display:block;margin-bottom:4px}
.lb-face a{color:#fff;text-decoration:underline}
.lb-location{color:#e4e4e7;font-size:12px;align-self:center}
#sort-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;align-items:center;justify-content:center}
.sort-card{background:#fff;border-radius:12px;padding:22px 36px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 32px rgba(0,0,0,.28);font-size:15px;font-weight:600;color:#3f3f46}
.spinner{width:22px;height:22px;border:3px solid #e4e4e7;border-top-color:#3b82f6;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.more-wrap{text-align:center;padding:16px 0 32px}
#more-btn{padding:8px 28px;font-size:13px;display:none}
.results-panel{margin:16px 32px;padding:14px 16px;background:#fff;border:1px solid #e4e4e7;border-radius:10px;scroll-margin-top:56px}
.results-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.results-head h2{font-size:14px}
.results-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.rcard{flex:0 0 auto;width:132px;text-align:center;position:relative}
.rcard .thumb{max-width:120px;max-height:120px}
.rcard.query{border-right:2px solid #e4e4e7;padding-right:10px;margin-right:4px}
.score{position:absolute;top:4px;left:8px;background:rgba(24,24,27,.75);color:#fff;font-size:10px;padding:1px 5px;border-radius:4px}
.copies{position:absolute;top:4px;right:8px;background:#fbbf24;color:#18181b;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px}
.rname{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#52525b;margin-top:2px}
.gallery-head{padding:20px 32px 4px;display:flex;align-items:baseline;gap:12px}
.gallery-head h2{font-size:16px}
.gallery{padding:12px 32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:#fff;border:1px solid #e4e4e7;border-radius:10px;padding:8px;text-align:center;position:relative}
.card .thumb{max-width:100%;max-height:130px}
.card-meta{font-size:11px;color:#71717a;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.similar-btn{margin-top:6px;padding:2px 10px;font-size:11px}
.date-view{padding:24px 32px}
.date-breadcrumb{margin-bottom:16px;font-size:13px;color:#71717a}
.date-breadcrumb a{color:#3f3f46;cursor:pointer;text-decoration:underline}
.date-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.date-card{background:#fff;border-radius:8px;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.date-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.date-card .date-card-label{padding:8px;font-size:13px;font-weight:600}
.date-card .date-card-count{padding:0 8px 8px;font-size:11px;color:#71717a}
img.heic-loading{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:linear-gradient(90deg,#e4e4e7 25%,#f4f4f5 37%,#e4e4e7 63%);background-size:400% 100%;animation:heicShimmer 1.4s ease infinite}
@keyframes heicShimmer{0%{background-position:100% 0}100%{background-position:0 0}}
</style>
</head>
<body>

<style>
.secnav{display:flex;gap:2px;padding:10px 16px;background:#1a1a1f;border-bottom:1px solid #2a2a33;position:sticky;top:0;z-index:50}
.secnav a{padding:6px 14px;border-radius:6px;color:#9a9aa8;text-decoration:none;font:500 14px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.secnav a:hover{background:#25252d;color:#d8d8e0}
.secnav a.on{background:#3b82f6;color:#fff}
</style>
<nav class="secnav">
<a href="/">Files</a>
<a href="/duplicates" class="on">Duplicates</a>
<a href="/date">Date</a>

<div id="sort-overlay"><div class="sort-card"><div class="spinner"></div>Sorting&hellip;</div></div>
<div class="lightbox" id="lb" onclick="closeLb()">
  <img id="lb-img" src="" alt="" onclick="event.stopPropagation()">
  <video id="lb-vid" src="" controls autoplay onclick="event.stopPropagation()" style="display:none"></video>
  <div class="lb-meta" id="lbMeta" onclick="event.stopPropagation()"></div>
</div>
<div class="header"><h1>videre</h1><p class="subtitle">/private<TMP>/test.db &mdash; <GENERATED_AT></p><div class="stats"><div class="stat"><span class="num">3</span><span class="label">Files scanned</span></div><div class="stat warn"><span class="num">1</span><span class="label">Duplicate groups</span></div><div class="stat warn"><span class="num">2</span><span class="label">Duplicate files</span></div><div class="stat warn"><span class="num">100 B</span><span class="label">Wasted space</span></div></div></div>
<div class="toolbar"><button onclick="expandAll()">Expand all</button><button onclick="collapseAll()">Collapse all</button><label class="sort-label">Sort by<select id="sort-select" onchange="sortGroups(this.value)"><option value="waste">Wasted space</option><option value="date-asc">Date kept (oldest first)</option><option value="date-desc">Date kept (newest first)</option></select></label><span class="info" id="shown-info">1 groups</span></div>
<div class="groups" id="groups-container"></div>
<div class="more-wrap"><button id="more-btn" onclick="showMore()"></button></div>
<script>
var LIVE_SERVER=true;
var GVIEW="all";
var PEOPLE_ROOT="/people";
</script>
<script>
var GROUPS=[

{"hash":"hdup","waste":100,"date":"2025-06-03T15:08:23","files":[{"hash":"hdup","path":"<TMP>/pics/a.jpg","ext":"jpg","size":100,"cr":null,"mo":null,"ex":"2025-06-03T15:08:23","lat":null,"lon":null,"w":null,"h":null,"tb":null,"fb":null,"meta":{"faces":[],"location":null}},{"hash":"hdup","path":"<TMP>/pics/b.jpg","ext":"jpg","size":100,"cr":null,"mo":null,"ex":"2025-06-03T15:08:23","lat":null,"lon":null,"w":null,"h":null,"tb":null,"fb":null,"meta":{"faces":[],"location":null}}]}
];

var PAGE=100,sorted=GROUPS.slice(),shown=0;

function escA(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escH(s){
  return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'';
}
// Must agree with videre_core::disk::human_bytes, which formats the same
// numbers server-side on the same page. A third copy of this lived in Rust
// and disagreed with both.
function fmtB(b){
  const U=['B','KB','MB','GB','TB'];
  if(b<1024)return b+' B';
  let v=b,u=0;
  while(v>=1024&&u<U.length-1){v/=1024;u++;}
  return v.toFixed(1)+' '+U[u];
}
function rawUrl(f, size){
  if(!LIVE_SERVER) return 'file://'+f.path;
  return '/api/files/'+encodeURIComponent(f.hash)+'/raw'+(size?('?size='+size):'');
}
function buildPreview(f){
  var ext=f.ext,path=f.path;
  var metaAttr=escA(JSON.stringify(f.meta));
  if(ext==='jpg'||ext==='jpeg'||ext==='png'||ext==='gif'||ext==='webp'||ext==='bmp'){
    var url=rawUrl(f);
    return '<a href="'+escA(url)+'" target="_blank" data-lb-url="'+escA(url)+'" data-lb-type="image" '+
      'data-lb-meta="'+metaAttr+'">'+
      '<img src="'+escA(url)+'" class="thumb" loading="lazy" '+
      'onerror="this.parentElement.innerHTML=\'<span class=no-prev>no preview</span>\'"></a>';
  }
  if(ext==='heic'){
    if(LIVE_SERVER){
      var thumbUrl=rawUrl(f, 240);
      var lbUrl=rawUrl(f, 1200);
      return '<img src="'+escA(thumbUrl)+'" class="thumb heic-loading" loading="lazy" data-lb-url="'+escA(lbUrl)+'" '+
        'data-lb-type="image" data-lb-meta="'+metaAttr+'" '+
        'onload="this.classList.remove(\'heic-loading\')" '+
        'onerror="this.parentElement.innerHTML=\'<span class=no-prev>no preview</span>\'">';
    }
    if(f.tb){
      var src='data:image/jpeg;base64,'+f.tb;
      var lb=f.fb?'data:image/jpeg;base64,'+f.fb:src;
      return '<img src="'+src+'" class="thumb" data-lb-url="'+escA(lb)+'" data-lb-type="image" '+
        'data-lb-meta="'+metaAttr+'">';
    }
    return '<span class="no-prev">HEIC</span>';
  }
  if(ext==='tiff')return '<span class="no-prev">TIFF</span>';
  if(ext==='dng') return '<span class="no-prev">DNG</span>';
  if(ext==='mov'||ext==='mp4'){
    var url=rawUrl(f);
    return '<video src="'+escA(url)+'" class="thumb" preload="metadata" muted playsinline '+
      'data-lb-url="'+escA(url)+'" data-lb-type="video" '+
      'data-lb-meta="'+metaAttr+'" '+
      'onerror="this.outerHTML=\'<span class=no-prev>no preview</span>\'"></video>';
  }
  return '<span class="no-prev">&mdash;</span>';
}
function buildRow(f,isKeep){
  var rc=isKeep?'keep':'remove';
  var bc=isKeep?'keep-badge':'remove-badge';
  var bt=isKeep?'KEEP':'REMOVE';
  var fname=f.path.split('/').pop()||f.path;
  var cr=f.cr||'<span class="dim">—</span>';
  var mo=f.mo||'<span class="dim">—</span>';
  var ex=f.ex||'<span class="dim">—</span>';
  var gps='<span class="dim">—</span>';
  if(f.lat!=null&&f.lon!=null){
    gps='<div class="gps"><a href="https://maps.google.com/?q='+f.lat.toFixed(6)+','+f.lon.toFixed(6)+
      '" target="_blank" rel="noopener">'+Math.abs(f.lat).toFixed(4)+'&deg;'+(f.lat>=0?'N':'S')+' '+
      Math.abs(f.lon).toFixed(4)+'&deg;'+(f.lon>=0?'E':'W')+'</a></div>';
  }
  var dims=(f.w&&f.h)?f.w+'×'+f.h:'<span class="dim">—</span>';
  return '<tr class="'+rc+'">'+
    '<td class="preview">'+buildPreview(f)+'</td>'+
    '<td class="badge"><span class="'+bc+'">'+bt+'</span>'+similarBtn(f.hash)+'</td>'+
    '<td class="filename" title="'+escA(fname)+'">'+escH(fname)+'</td>'+
    '<td class="path-cell"><span class="path-text">'+escH(f.path)+'</span>'+
    '<button class="copy-btn" data-path="'+escA(f.path)+'" title="Copy path">&#x2398;</button></td>'+
    '<td>'+fmtB(f.size)+'</td>'+
    '<td class="dim">'+cr+'</td>'+
    '<td class="dim">'+mo+'</td>'+
    '<td class="dim">'+ex+'</td>'+
    '<td>'+gps+'</td>'+
    '<td class="dim">'+dims+'</td>'+
    '</tr>';
}
function buildGroup(g,idx){
  var rows=g.files.map(function(f,j){return buildRow(f,j===0);}).join('');
  return '<div class="group" id="g'+idx+'">'+
    '<div class="group-header">'+
    '<span class="arrow">&#9654;</span>'+
    '<code class="hash">'+escH(g.hash)+'</code>'+
    '<span class="group-meta">'+g.files.length+' copies &middot; '+fmtB(g.files[0].size)+' each</span>'+
    '<span class="waste">&minus;'+fmtB(g.waste)+' wasted</span>'+
    '</div>'+
    '<div class="group-body">'+
    '<table><thead><tr>'+
    '<th class="preview-th">Preview</th>'+
    '<th>Status</th><th>Filename</th><th>Path</th>'+
    '<th>Size</th><th>Created</th><th>Modified</th><th>EXIF date</th>'+
    '<th>GPS</th><th>Dimensions</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function render(reset){
  var overlay=document.getElementById('sort-overlay');
  var container=document.getElementById('groups-container');
  if(!container){if(overlay)overlay.style.display='none';return;}
  if(reset){shown=0;container.innerHTML='';}
  var end=Math.min(shown+PAGE,sorted.length);
  var html='';
  for(var i=shown;i<end;i++)html+=buildGroup(sorted[i],i);
  var tmp=document.createElement('div');
  tmp.innerHTML=html;
  while(tmp.firstChild)container.appendChild(tmp.firstChild);
  shown=end;
  updateBtn();
  overlay.style.display='none';
}
function updateBtn(){
  var btn=document.getElementById('more-btn');
  if(!btn)return;
  var rem=sorted.length-shown;
  if(rem>0){btn.style.display='inline-block';btn.textContent='Show more ('+rem+' remaining)';}
  else btn.style.display='none';
}
function showMore(){render(false);}
function toggle(id){
  var g=document.getElementById(id);
  g.classList.toggle('open');
  if(g.classList.contains('open')){
    g.querySelectorAll('img').forEach(function(img){if(img.loading==='lazy')img.loading='eager';});
    g.querySelectorAll('video').forEach(function(v){if(v.preload==='metadata')v.preload='auto';});
  }
}
function expandAll(){
  document.querySelectorAll('.group').forEach(function(g){
    g.classList.add('open');
    g.querySelectorAll('img').forEach(function(img){if(img.loading==='lazy')img.loading='eager';});
    g.querySelectorAll('video').forEach(function(v){if(v.preload==='metadata')v.preload='auto';});
  });
}
function collapseAll(){document.querySelectorAll('.group').forEach(function(g){g.classList.remove('open');});}
function copyPath(p){
  navigator.clipboard.writeText(p).catch(function(){
    var t=document.createElement('textarea');t.value=p;
    document.body.appendChild(t);t.select();document.execCommand('copy');
    document.body.removeChild(t);
  });
}
function renderMetaPanel(meta){
  var el = document.getElementById('lbMeta');
  if(!meta || (!meta.faces.length && !meta.location)){
    el.classList.remove('on'); el.innerHTML=''; return;
  }
  var parts = [];
  if(meta.faces.length){
    // A live page carries `id` and fetches the crop from the endpoint only when
    // this lightbox opens. A static export has no server to ask, so it carries
    // `thumb` as a data URI. Supporting both keeps one renderer for both.
    parts.push(meta.faces.map(function(fc){
      var src = fc.thumb ? escA(fc.thumb) : '/api/faces/'+encodeURIComponent(fc.id)+'/image';
      return '<div class="lb-face"><img src="'+src+'" loading="lazy">'+
        '<a href="'+peopleRootG()+'person/'+encodeURIComponent(fc.name)+'?from=lightbox">'+escH(fc.name)+'</a></div>';
    }).join(''));
  }
  if(meta.location){
    var locId = 'lbLoc'+Math.random().toString(36).slice(2);
    parts.push('<div class="lb-location" id="'+locId+'">Loading location...</div>');
    fetch('/api/locations?lat='+meta.location.lat+'&lon='+meta.location.lon)
      .then(function(r){ return r.json(); })
      .then(function(d){
        var n = document.getElementById(locId);
        if(n) n.textContent = d.name || 'Unknown location';
      })
      .catch(function(){
        var n = document.getElementById(locId);
        if(n) n.textContent = 'Location unavailable';
      });
  }
  el.innerHTML = parts.join('');
  el.classList.add('on');
}
function openLb(url,type,metaJson){
  var meta = null;
  try { meta = metaJson ? JSON.parse(metaJson) : null; } catch(e) {}
  renderMetaPanel(meta);
  var img=document.getElementById('lb-img');
  var vid=document.getElementById('lb-vid');
  if(type==='video'){
    img.style.display='none';vid.style.display='block';
    vid.src=url;vid.play();
  } else {
    vid.style.display='none';img.style.display='block';img.src=url;
  }
  document.getElementById('lb').classList.add('on');
}
function closeLb(){
  var vid=document.getElementById('lb-vid');
  vid.pause();vid.src='';
  document.getElementById('lb-img').src='';
  document.getElementById('lb').classList.remove('on');
}
function sortGroups(by){
  var overlay=document.getElementById('sort-overlay');
  overlay.style.display='flex';
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      sorted.sort(function(a,b){
        if(by==='waste')return b.waste-a.waste;
        var da=a.date||'￿',db=b.date||'￿';
        return by==='date-asc'?da.localeCompare(db):db.localeCompare(da);
      });
      render(true);
    });
  });
}
function bestDateBucket(f){
  var d = bestDateJs(f);
  if(!d) return null;
  return {year: d.slice(0,4), month: d.slice(0,7), day: d.slice(0,10)};
}
var dateState = {level:'year', year:null, month:null};
function dateKeepFiles(){ return (typeof KEEPFILES!=='undefined') ? KEEPFILES : []; }

// :warning: The tree comes from /api/dates, not from the rows.
//
// Grouping a page of 200 files by year shows a tree that grows as you scroll,
// which is worse than no tree at all. Counts have to describe the whole library,
// so the server groups and the client draws. One request per level, so a
// response is a few dozen buckets rather than a library.
//
// An inlined page (a static export, which has no server) still groups locally.
function dateInlined(){ return typeof KEEPFILES!=='undefined'; }

function dateCards(buckets,onclick){
  return buckets.map(function(b){
    return '<div class="date-card" data-key="'+escA(b.key)+'" onclick="'+onclick(b.key)+'">'+
      buildPreview(b.sample)+
      '<div class="date-card-label">'+escH(b.key)+'</div>'+
      '<div class="date-card-count">'+b.count+' files</div></div>';
  }).join('');
}
function fetchBuckets(level,parent,then){
  var grid=document.getElementById('dateGrid');
  grid.innerHTML='<p class="muted">Loading\u2026</p>';
  var q='/api/dates?level='+encodeURIComponent(level);
  if(parent)q+='&parent='+encodeURIComponent(parent);
  fetch(q).then(function(r){return r.json();})
    .then(function(d){ then(d.buckets||[]); })
    .catch(function(){ grid.innerHTML='<p class="muted">Could not load dates.</p>'; });
}
// Groups inlined rows the old way, for a static export.
function groupInlined(len,parent){
  var by={};
  dateKeepFiles().forEach(function(f){
    var d=bestDateJs(f); if(!d)return;
    var k=d.slice(0,len);
    if(parent && d.slice(0,parent.length)!==parent) return;
    (by[k]=by[k]||[]).push(f);
  });
  return Object.keys(by).sort().reverse().map(function(k){
    return {key:k,count:by[k].length,sample:by[k][0]};
  });
}

function buildYearView(){
  dateState={level:'year',year:null,month:null};
  document.getElementById('dateBreadcrumb').innerHTML='';
  var draw=function(b){
    document.getElementById('dateGrid').innerHTML=
      dateCards(b,function(k){return "buildMonthView('"+k+"')";});
  };
  if(dateInlined())draw(groupInlined(4,null)); else fetchBuckets('year',null,draw);
}
function buildMonthView(year){
  dateState={level:'month',year:year,month:null};
  document.getElementById('dateBreadcrumb').innerHTML=
    '<a onclick="buildYearView()">'+escH(year)+'</a>';
  var draw=function(b){
    document.getElementById('dateGrid').innerHTML=
      dateCards(b,function(k){return "buildDayView('"+k+"')";});
  };
  if(dateInlined())draw(groupInlined(7,year)); else fetchBuckets('month',year,draw);
}
function buildDayView(month){
  dateState={level:'day',year:dateState.year||month.slice(0,4),month:month};
  document.getElementById('dateBreadcrumb').innerHTML=
    '<a onclick="buildYearView()">'+escH(dateState.year)+'</a> &gt; '+
    '<a onclick="buildMonthView(\''+dateState.year+'\')">'+escH(month)+'</a>';
  var draw=function(b){
    document.getElementById('dateGrid').innerHTML=
      dateCards(b,function(k){return "buildDayGallery('"+k+"')";});
  };
  if(dateInlined())draw(groupInlined(10,month)); else fetchBuckets('day',month,draw);
}
function buildDayGallery(day){
  document.getElementById('dateBreadcrumb').innerHTML=
    '<a onclick="buildYearView()">'+escH(dateState.year)+'</a> &gt; '+
    '<a onclick="buildMonthView(\''+dateState.year+'\')">'+escH(dateState.month)+'</a> &gt; '+escH(day);
  var grid=document.getElementById('dateGrid');
  if(dateInlined()){
    var files=dateKeepFiles().filter(function(f){
      var d=bestDateJs(f); return d && d.slice(0,10)===day;
    });
    grid.innerHTML=files.map(function(f){return buildCard(f);}).join('');
    return;
  }
  grid.innerHTML='<p class="muted">Loading\u2026</p>';
  fetch('/api/files?view=date&date='+encodeURIComponent(day)+'&limit=500')
    .then(function(r){return r.json();})
    .then(function(d){
      grid.innerHTML=(d.files||[]).map(function(f){return buildCard(f);}).join('');
    })
    .catch(function(){ grid.innerHTML='<p class="muted">Could not load that day.</p>'; });
}
// Event delegation: toggle, lightbox, copy. One listener for all dynamic content
document.addEventListener('click',function(e){
  var lb=e.target.closest('[data-lb-url]');
  if(lb){e.preventDefault();e.stopPropagation();openLb(lb.dataset.lbUrl,lb.dataset.lbType||'image',lb.dataset.lbMeta);return;}
  var cp=e.target.closest('[data-path]');
  if(cp){copyPath(cp.dataset.path);return;}
  var hdr=e.target.closest('.group-header');
  if(hdr){toggle(hdr.closest('.group').id);return;}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLb();});
document.getElementById('lb').addEventListener('click',function(e){
  if(e.target===this)closeLb();
});

// ---- All-files gallery and similarity search (active only with --all) ----
// RESULT_ROWS holds only the rows a search returned, a couple of dozen at most.
// HASH_FILES stays for the inlined static export, whose rows carry no `copies`
// field and so must be counted client-side.
var GPAGE=200,gShown=0,HASH_FILES={},RESULT_ROWS={};
// See faces.js: the labeling sub-pages are not always under /people.
function peopleRootG(){
  var r=(typeof PEOPLE_ROOT==='string')?PEOPLE_ROOT:'/people';
  return r.charAt(r.length-1)==='/'?r:r+'/';
}
function bestDateJs(f){
  if(f.ex&&f.ex.indexOf('0000')!==0)return f.ex;
  if(f.cr&&f.mo)return f.cr<f.mo?f.cr:f.mo;
  return f.cr||f.mo||'';
}
// Similarity is a server feature now, so it works at every library size. It
// used to appear only when the page had downloaded every vector, which switched
// it off for exactly the libraries big enough to want it. A static export has
// no server to ask, so it has no button.
function similarBtn(hash){
  if(typeof LIVE_SERVER==='undefined'||!LIVE_SERVER)return '';
  return '<button class="similar-btn" data-similar="'+escA(hash)+'">Similar</button>';
}
function buildCard(f){
  var fname=f.path.split('/').pop()||f.path;
  // `copies` arrives on the row from /api/files. An inlined page has no such
  // field and falls back to counting the array, which is the only reason that
  // array ever had to be complete.
  var n = (typeof f.copies==='number') ? f.copies
        : (HASH_FILES[f.hash] ? HASH_FILES[f.hash].length : 1);
  var copies = n>1 ? '<span class="copies">x'+n+'</span>' : '';
  return '<div class="card" data-hash="'+escA(f.hash)+'">'+copies+
    buildPreview(f)+
    '<div class="card-meta" title="'+escA(f.path)+'">'+escH(fname)+'</div>'+
    '<div class="card-meta">'+fmtB(f.size)+(bestDateJs(f)?' &middot; '+escH(bestDateJs(f)):'')+'</div>'+
    similarBtn(f.hash)+
    '</div>';
}
// Appends one page of cards and updates the button. Shared by both paths, so an
// inlined page and a fetched one render identically.
function appendCards(files,total){
  var g=document.getElementById('gallery');
  var html='';
  for(var i=0;i<files.length;i++)html+=buildCard(files[i]);
  var tmp=document.createElement('div');
  tmp.innerHTML=html;
  while(tmp.firstChild)g.appendChild(tmp.firstChild);
  gShown+=files.length;
  var btn=document.getElementById('gallery-more');
  var rem=total-gShown;
  if(rem>0){btn.style.display='inline-block';btn.textContent='Show more ('+rem+' remaining)';}
  else btn.style.display='none';
}
// Guards a second fetch while one is in flight; a double-click on "Show more"
// would otherwise append the same page twice.
var gLoading=false;
function renderGallery(){
  if(typeof ALLFILES!=='undefined'){
    appendCards(ALLFILES.slice(gShown,gShown+GPAGE),ALLFILES.length);
    return;
  }
  if(gLoading)return;
  gLoading=true;
  var btn=document.getElementById('gallery-more');
  if(btn)btn.textContent='Loading\u2026';
  fetch('/api/files?view='+encodeURIComponent(GVIEW)+'&offset='+gShown+'&limit='+GPAGE)
    .then(function(r){ return r.json(); })
    .then(function(d){ gLoading=false; appendCards(d.files||[],d.total||0); })
    .catch(function(){
      gLoading=false;
      // Say so, rather than leaving a button that silently does nothing.
      if(btn)btn.textContent='Could not load more. Click to retry.';
    });
}
function showMoreGallery(){renderGallery();}
function findSimilar(hash){
  var panel=document.getElementById('results');
  if(panel){panel.style.display='block';panel.innerHTML='<div class="results-head"><h2>Searching&hellip;</h2></div>';}
  fetch('/api/search?like='+encodeURIComponent(hash)+'&limit=24')
    .then(function(r){ if(!r.ok)throw 0; return r.json(); })
    .then(function(d){ renderResults(hash,d.results||[]); })
    .catch(function(){
      if(panel)panel.innerHTML='<div class="results-head"><h2>Search failed</h2>'+
        '<button onclick="clearResults()">Clear</button></div>';
    });
}
function resultCard(hash,score,isQuery){
  var f=RESULT_ROWS[hash];
  if(!f)return '';
  var fname=f.path.split('/').pop()||f.path;
  var badge=isQuery?'':'<span class="score">'+score.toFixed(3)+'</span>';
  var n=(typeof f.copies==='number')?f.copies:1;
  var copies=n>1?'<span class="copies">x'+n+'</span>':'';
  return '<div class="rcard'+(isQuery?' query':'')+'" data-hash="'+escA(hash)+'">'+
    badge+copies+buildPreview(f)+
    '<div class="rname" title="'+escA(f.path)+'">'+(isQuery?'query: ':'')+escH(fname)+'</div>'+
    '</div>';
}
// :warning: Results are drawn from rows fetched by hash, not from a complete
// in-memory array. Similarity ranks a few dozen out of the whole library, and
// requiring every row to be present just to display 24 of them is what made the
// page carry the library in the first place.
function renderResults(qHash,scored){
  var need=[qHash];
  for(var i=0;i<scored.length;i++)need.push(scored[i].hash);
  var missing=need.filter(function(h){return !RESULT_ROWS[h];});
  if(missing.length===0){ drawResults(qHash,scored); return; }
  fetch('/api/files?hashes='+encodeURIComponent(missing.join(',')))
    .then(function(r){ return r.json(); })
    .then(function(d){
      (d.files||[]).forEach(function(f){ RESULT_ROWS[f.hash]=f; });
      drawResults(qHash,scored);
    })
    .catch(function(){ drawResults(qHash,scored); });
}
function drawResults(qHash,scored){
  var panel=document.getElementById('results');
  var html='<div class="results-head"><h2>Similar images</h2>'+
    '<button onclick="clearResults()">Clear</button></div>'+
    '<div class="results-strip">'+resultCard(qHash,1,true);
  for(var i=0;i<scored.length;i++){
    html+=resultCard(scored[i].hash,scored[i].score,false);
  }
  html+='</div>';
  panel.innerHTML=html;
  panel.style.display='block';
  panel.querySelectorAll('img').forEach(function(img){if(img.loading==='lazy')img.loading='eager';});
  panel.scrollIntoView({behavior:'smooth',block:'start'});
}
function clearResults(){
  var panel=document.getElementById('results');
  panel.style.display='none';
  panel.innerHTML='';
}
if(typeof ALLFILES!=='undefined'){
  ALLFILES.forEach(function(f){
    (HASH_FILES[f.hash]=HASH_FILES[f.hash]||[]).push(f);
  });
  renderGallery();
}else if(document.getElementById('gallery')){
  // Nothing inlined: a live page. Fetch the first page.
  renderGallery();
}
document.addEventListener('click',function(e){
  var sb=e.target.closest('[data-similar]');
  if(sb){e.preventDefault();e.stopPropagation();findSimilar(sb.dataset.similar);}
});
render(true);
if(document.getElementById('dateGrid')) buildYearView();
</script>
</body>
</html>
