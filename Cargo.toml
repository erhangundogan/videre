[workspace]
resolver = "2"
members = ["crates/videre", "crates/videre-api", "crates/videre-core", "crates/videre-ml"]

# Optimize dependencies even in dev/test builds. Our own crates stay
# unoptimized, so they still compile fast and debug normally.
#
# candle runs inference through gemm; unoptimized, one 224px forward pass
# measured 9.41s against 0.168s in release, 56x. `cargo test --workspace` is a
# debug build, so cpu_batch_matches_single_image_baseline - 48 images batched
# plus 5 single re-runs - spent about 8 minutes per CI run tripping libtest's
# "has been running for over 60 seconds" notice. The same cost is why that test
# is #[cfg]'d off macOS.
#
# Applies to dependencies only ("*" excludes workspace members), so the
# compile-time cost lands once per rust-cache key rather than per run.
[profile.dev.package."*"]
opt-level = 3
