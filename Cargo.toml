[workspace]
resolver = "2"
members = ["crates/videre", "crates/videre-api", "crates/videre-core", "crates/videre-ml"]

# Clippy is gated in CI (`cargo clippy --all-targets -- -D warnings`), so every
# lint either passes or is allowed here with a reason. Two are allowed workspace
# wide because they are subjective structural lints, not correctness ones, and
# clearing them would mean churny refactors that do not make the code clearer:
#   - type_complexity: a few SQL row tuples and pipeline channels are genuinely
#     that shape; naming each as a `type` alias trades one obscurity for another.
#   - too_many_arguments: a handful of internal renderers/pipeline entry points
#     take their inputs positionally; bundling them into one-off structs is more
#     indirection than it removes.
# Everything else is fixed rather than allowed. Each crate opts in via
# `[lints] workspace = true`.
[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

# No `[profile.dev.package."*"] opt-level` here, deliberately.
#
# 0.15.4 added one so that cpu_batch_matches_single_image_baseline, which runs
# CPU inference, would stop taking 38 minutes on CI. It worked - 2287s to 66s -
# but optimizing every dependency put release-grade codegen in the test build:
# Build went from ~35s to 660s on Ubuntu, and it did not amortize the way a
# per-cache-key cost should. Net, ~600s was paid on most runs to save a test
# that had never actually run on Linux until a download bug woke it.
#
# The real fix was upstream of both: that test skips when SigLIP weights are
# absent, the warm-up step fetches them on macOS only, and the weights only
# reached Linux because the argument sweep downloaded them (fixed in 0.15.6,
# with the cache key salted to discard the artifact). With them gone the test
# skips again in milliseconds and there is nothing to optimize for.
#
# So: do not add this back to make one inference test bearable. If a test needs
# release-speed inference, run it in release, in its own job.

