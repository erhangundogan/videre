# Astro resolves virtual module specifiers such as `astro:toolbar:internal`,
# which are not real packages. Yarn's default PnP linker rejects those as
# "ambiguous and unsound" and the build fails at the rolldown stage, so this
# project uses the node_modules layout. Not a preference: PnP does not work here.
nodeLinker: node-modules

# Deliberately no `yarnPath`, so the ~2.7MB Yarn release is not vendored into
# what is otherwise a Rust repository. The `packageManager` field in
# package.json pins the exact version instead, which Corepack honours.
