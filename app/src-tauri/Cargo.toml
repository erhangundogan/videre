[package]
name = "app"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Explicitly stand alone (the root Cargo.toml already excludes this crate from
# the main workspace) - needed so Cargo's upward workspace search stops here
# instead of crossing into an ancestor directory's workspace, which happens
# when this crate is checked out somewhere nested inside another Cargo
# workspace's directory tree (e.g. a worktree under .claude/worktrees/).
[workspace]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
videre-api = { path = "../../crates/videre-api" }
videre-core = { path = "../../crates/videre-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"

